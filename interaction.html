<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="theme-color" content="#f2eee5" />
        <title>My Journey of Learning English · Live</title>
        <style>
            :root {
                --bg: #f2eee5;
                --bg-2: #eae4d7;
                --card: #fffcf7;
                --ink: #191d24;
                --muted: #6f6a61;
                --line: #dcd4c6;
                --accent: #cb4a2b;
                --teal: #1c6b64;
                --gold: #a97b2b;
                --shadow: 0 18px 40px -28px rgba(25, 29, 36, 0.45);
                --ink-08: rgba(25, 29, 36, 0.08);
                --ink-09: rgba(25, 29, 36, 0.09);
                --ink-10: rgba(25, 29, 36, 0.1);
                --ink-22: rgba(25, 29, 36, 0.22);
                --accent-10: rgba(203, 74, 43, 0.1);
                --accent-16: rgba(203, 74, 43, 0.16);
                --accent-45: rgba(203, 74, 43, 0.45);
                --accent-50: rgba(203, 74, 43, 0.5);
                --accent-55: rgba(203, 74, 43, 0.55);
                --teal-10: rgba(28, 107, 100, 0.1);
                --teal-16: rgba(28, 107, 100, 0.16);
                --teal-45: rgba(28, 107, 100, 0.45);
                --gold-10: rgba(169, 123, 43, 0.1);
                --gold-45: rgba(169, 123, 43, 0.45);
                --gold-50: rgba(169, 123, 43, 0.5);
            }
            body[data-theme="ink"] {
                --bg: #101318;
                --bg-2: #0c0f13;
                --card: #1a1f27;
                --ink: #f2eee5;
                --muted: #98a1aa;
                --line: #2d343e;
                --accent: #ff6a45;
                --teal: #53c4b6;
                --gold: #d6a95a;
                --shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.9);
                --ink-08: rgba(242, 238, 229, 0.08);
                --ink-09: rgba(242, 238, 229, 0.09);
                --ink-10: rgba(242, 238, 229, 0.1);
                --ink-22: rgba(242, 238, 229, 0.22);
                --accent-10: rgba(255, 106, 69, 0.1);
                --accent-16: rgba(255, 106, 69, 0.16);
                --accent-45: rgba(255, 106, 69, 0.45);
                --accent-50: rgba(255, 106, 69, 0.5);
                --accent-55: rgba(255, 106, 69, 0.55);
                --teal-10: rgba(83, 196, 182, 0.1);
                --teal-16: rgba(83, 196, 182, 0.16);
                --teal-45: rgba(83, 196, 182, 0.45);
                --gold-10: rgba(214, 169, 90, 0.1);
                --gold-45: rgba(214, 169, 90, 0.45);
                --gold-50: rgba(214, 169, 90, 0.5);
            }
            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                margin: 0;
                padding: 0;
            }
            body {
                background:
                    radial-gradient(
                        1200px 600px at 50% -10%,
                        var(--bg-2),
                        transparent 70%
                    ),
                    var(--bg);
                color: var(--ink);
                font-family:
                    ui-sans-serif,
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    "PingFang SC",
                    "Hiragino Sans GB",
                    "Microsoft YaHei",
                    sans-serif;
                font-size: 16px;
                line-height: 1.5;
                min-height: 100vh;
                min-height: 100dvh;
                transition:
                    background 0.35s ease,
                    color 0.35s ease;
            }
            .app {
                max-width: 600px;
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0 auto;
                padding: 18px 18px calc(28px + env(safe-area-inset-bottom));
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .screen {
                animation: rise 0.3s cubic-bezier(0.2, 0.7, 0.2, 1) both;
                display: flex;
                flex-direction: column;
                gap: 16px;
                flex: 1;
            }
            @keyframes rise {
                from {
                    opacity: 0;
                    transform: translateY(9px);
                }
                to {
                    opacity: 1;
                    transform: none;
                }
            }
            @media (prefers-reduced-motion: reduce) {
                .screen,
                .bar-fill {
                    animation: none !important;
                    transition: none !important;
                }
            }

            .top {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding-top: 4px;
            }
            .brand {
                font:
                    700 11px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .pill {
                font:
                    600 10px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--accent);
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 7px 10px;
                white-space: nowrap;
            }
            .kicker {
                font:
                    700 10.5px/1.4 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
            }
            /* 装饰用大号 emoji：只作点缀，不进入正文语义 */
            .big-emoji {
                font-size: 44px;
                line-height: 1;
                margin: 0 0 2px;
                user-select: none;
            }
            .big-emoji.sm {
                font-size: 34px;
            }
            h1,
            h2 {
                margin: 0;
                font-family:
                    Georgia, "Times New Roman", "Songti SC",
                    "Noto Serif CJK SC", serif;
                font-weight: 500;
                letter-spacing: -0.01em;
            }
            h1 {
                font-size: 34px;
                line-height: 1.12;
            }
            h2 {
                font-size: 25px;
                line-height: 1.25;
            }
            p {
                margin: 0;
            }
            .lead {
                color: var(--muted);
                font-size: 15px;
                line-height: 1.55;
            }
            .zh {
                color: var(--muted);
                font-size: 13px;
                line-height: 1.6;
            }
            .muted {
                color: var(--muted);
            }
            .tiny {
                font-size: 11.5px;
                line-height: 1.5;
                color: var(--muted);
            }

            .card {
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 20px;
                padding: 22px;
                box-shadow: var(--shadow);
            }
            .card.flush {
                padding: 0;
                overflow: hidden;
            }

            .btn {
                appearance: none;
                border: 0;
                font: 600 15px/1.2 inherit;
                font-family: inherit;
                border-radius: 14px;
                padding: 17px 20px;
                cursor: pointer;
                transition:
                    transform 0.15s ease,
                    background 0.2s ease,
                    border-color 0.2s ease;
                touch-action: manipulation;
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn.primary {
                background: var(--accent);
                color: #fffaf4;
            }
            body[data-theme="ink"] .btn.primary {
                color: #16110e;
            }
            .btn.ghost {
                background: transparent;
                color: var(--ink);
                border: 1px solid var(--line);
            }
            .btn.block {
                width: 100%;
            }

            .stack {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .row {
                display: flex;
                gap: 10px;
            }
            .row > * {
                flex: 1;
            }

            /* ---------- landing ---------- */
            .hero {
                padding: 8px 4px 2px;
                display: flex;
                flex-direction: column;
                gap: 14px;
            }
            .hero h1 {
                font-size: 40px;
            }
            .menu {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .menu a {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 14px;
                text-decoration: none;
                color: var(--ink);
                background: var(--card);
                border: 1px solid var(--line);
                border-radius: 18px;
                padding: 18px 18px;
                box-shadow: var(--shadow);
            }
            .menu a:active {
                transform: scale(0.99);
            }
            .menu .meta {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .menu .t {
                font:
                    600 17px/1.2 Georgia,
                    serif;
            }
            .menu .s {
                font-size: 12px;
                color: var(--muted);
            }
            .menu .go {
                font-size: 20px;
                color: var(--accent);
            }

            /* ---------- survey ---------- */
            .progress-wrap {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .progress-meta {
                display: flex;
                justify-content: space-between;
                font:
                    700 10px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .track {
                height: 4px;
                border-radius: 99px;
                background: var(--line);
                overflow: hidden;
            }
            .fill {
                height: 100%;
                width: 0;
                background: var(--accent);
                border-radius: 99px;
                transition: width 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
            }

            .statement-card {
                display: flex;
                flex-direction: column;
                gap: 12px;
                flex: 1;
            }
            .statement {
                font-size: 26px;
                line-height: 1.28;
                margin-top: 2px;
            }
            .scale {
                display: flex;
                flex-direction: column;
                gap: 9px;
                margin-top: 6px;
            }
            .opt {
                display: flex;
                align-items: center;
                gap: 14px;
                width: 100%;
                text-align: left;
                background: var(--card);
                color: var(--ink);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 14px 16px;
                min-height: 56px;
                font: 500 15px/1.3 inherit;
                font-family: inherit;
                cursor: pointer;
                transition:
                    border-color 0.15s ease,
                    background 0.15s ease,
                    transform 0.12s ease;
            }
            .opt .n {
                flex: none;
                width: 28px;
                height: 28px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--ink-08);
                color: var(--muted);
                font:
                    700 12px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
            }
            .opt .label {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }
            .opt .label em {
                font-style: normal;
                font-size: 11px;
                color: var(--muted);
            }
            .opt:active,
            .opt.chosen {
                border-color: var(--accent);
                transform: scale(0.985);
            }
            .opt.chosen .n {
                background: var(--accent);
                color: #fff;
            }
            .opt.disabled {
                pointer-events: none;
                opacity: 0.55;
            }

            .survey-foot {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
            }

            /* ---------- result ---------- */
            .score-row {
                display: flex;
                align-items: baseline;
                gap: 8px;
                margin: 6px 0 2px;
            }
            .score {
                font:
                    500 64px/1 Georgia,
                    serif;
                letter-spacing: -0.02em;
                font-variant-numeric: tabular-nums;
            }
            .of {
                color: var(--muted);
                font-size: 13px;
            }
            .band {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                border-radius: 999px;
                padding: 8px 14px;
                font:
                    700 11px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                width: fit-content;
            }
            .band.low {
                color: var(--teal);
                border: 1px solid var(--teal-45);
                background: var(--teal-10);
            }
            .band.moderate {
                color: var(--gold);
                border: 1px solid var(--gold-45);
                background: var(--gold-10);
            }
            .band.high {
                color: var(--accent);
                border: 1px solid var(--accent-45);
                background: var(--accent-10);
            }

            .bars {
                display: flex;
                flex-direction: column;
                gap: 14px;
                margin: 4px 0;
            }
            .bar-row {
                display: flex;
                flex-direction: column;
                gap: 7px;
            }
            .bar-head {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 10px;
            }
            .bar-name {
                font-size: 13px;
                line-height: 1.3;
            }
            .bar-name span {
                display: block;
                font-size: 10.5px;
                color: var(--muted);
                letter-spacing: 0.04em;
            }
            .bar-val {
                font:
                    600 12px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                color: var(--muted);
                font-variant-numeric: tabular-nums;
            }
            .bar-track {
                height: 7px;
                border-radius: 99px;
                background: var(--ink-10);
                overflow: hidden;
            }
            .bar-fill {
                height: 100%;
                border-radius: 99px;
                width: 0;
                transition: width 0.8s cubic-bezier(0.2, 0.7, 0.2, 1);
            }
            .bar-fill.pain {
                background: var(--accent);
            }
            .bar-fill.habits {
                background: var(--teal);
            }
            .bar-fill.attitude {
                background: var(--gold);
            }

            .read {
                font-size: 14.5px;
                line-height: 1.6;
                color: var(--ink);
            }
            .read strong {
                font-weight: 600;
            }
            .tipbox {
                border-left: 2px solid var(--accent);
                padding: 2px 0 2px 14px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .tip {
                font-size: 13.5px;
                line-height: 1.55;
            }
            .tip b {
                display: block;
                font:
                    700 9.5px/1.6 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .tip strong {
                display: block;
                font-weight: 600;
            }

            .hands {
                border: 1px dashed var(--ink-22);
                border-radius: 16px;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .hands .kicker {
                color: var(--accent);
            }
            .hands ol {
                margin: 0;
                padding-left: 18px;
                display: flex;
                flex-direction: column;
                gap: 7px;
                font-size: 13.5px;
                line-height: 1.5;
            }
            .hands li::marker {
                color: var(--accent);
            }

            /* ---------- race ---------- */
            .race-top {
                display: flex;
                align-items: center;
                gap: 9px;
                font:
                    700 10.5px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--accent);
                box-shadow: 0 0 0 0 var(--accent-55);
                animation: pulse 1.8s infinite;
            }
            @keyframes pulse {
                0% {
                    box-shadow: 0 0 0 0 var(--accent-55);
                }
                70% {
                    box-shadow: 0 0 0 9px transparent;
                }
                100% {
                    box-shadow: 0 0 0 0 transparent;
                }
            }

            .wait {
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 18px;
                flex: 1;
                padding: 16px 0 8px;
            }
            .wait h1 {
                font-size: 34px;
            }
            .count {
                font:
                    600 64px/1 Georgia,
                    serif;
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.02em;
                color: var(--accent);
            }
            .wait-sub {
                font-size: 14px;
                color: var(--muted);
            }
            .wait-sub b {
                color: var(--ink);
                font-weight: 600;
                font-variant-numeric: tabular-nums;
            }
            .sync {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                font-size: 11px;
                color: var(--muted);
                width: fit-content;
                border: 1px solid var(--line);
                border-radius: 999px;
                padding: 6px 10px;
            }

            .qwrap {
                display: flex;
                flex-direction: column;
                gap: 14px;
                flex: 1;
            }
            .qhead {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
            }
            .live-time {
                font:
                    600 13px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                color: var(--accent);
                font-variant-numeric: tabular-nums;
            }
            .qwrap h2 {
                font-size: 27px;
                line-height: 1.28;
            }
            .race-opts {
                display: flex;
                flex-direction: column;
                gap: 9px;
                margin-top: 2px;
            }
            .race-opt {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                width: 100%;
                text-align: left;
                background: var(--card);
                color: var(--ink);
                border: 1px solid var(--line);
                border-radius: 14px;
                padding: 14px 15px;
                min-height: 58px;
                font: 500 15px/1.35 inherit;
                font-family: inherit;
                cursor: pointer;
                transition:
                    border-color 0.12s ease,
                    transform 0.1s ease,
                    background 0.12s ease;
            }
            .race-opt .k {
                flex: none;
                width: 26px;
                height: 26px;
                display: grid;
                place-items: center;
                border-radius: 8px;
                background: var(--ink-09);
                color: var(--muted);
                font:
                    700 11px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                margin-top: 1px;
            }
            .race-opt:active {
                transform: scale(0.985);
                border-color: var(--accent);
            }
            .race-opt.chosen {
                border-color: var(--accent);
                background: var(--accent-10);
            }
            .race-opt.dim {
                opacity: 0.38;
            }

            .judge {
                display: inline-flex;
                width: fit-content;
                font:
                    700 10.5px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                color: var(--accent);
                border: 1px solid var(--accent-50);
                border-radius: 999px;
                padding: 8px 12px;
            }
            .big-time {
                font:
                    600 92px/1 Georgia,
                    serif;
                letter-spacing: -0.03em;
                font-variant-numeric: tabular-nums;
                margin: 2px 0;
            }
            .big-time span {
                font-size: 26px;
                vertical-align: 8px;
                margin-left: 4px;
                color: var(--muted);
                letter-spacing: 0;
            }
            .verdict {
                display: inline-flex;
                width: fit-content;
                border-radius: 8px;
                padding: 7px 12px;
                font:
                    700 12px/1 ui-sans-serif,
                    system-ui,
                    sans-serif;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
            .verdict.ok {
                background: var(--teal-16);
                color: var(--teal);
            }
            .verdict.no {
                background: var(--accent-16);
                color: var(--accent);
            }
            .answer-line {
                font-size: 14px;
                line-height: 1.55;
                color: var(--ink);
            }
            .answer-line b {
                font-weight: 600;
            }
            .explain {
                font-size: 13px;
                line-height: 1.55;
                color: var(--muted);
                border-top: 1px solid var(--line);
                padding-top: 12px;
            }
            .rank-note {
                font-size: 12.5px;
                line-height: 1.5;
                color: var(--muted);
            }

            .foot {
                margin-top: auto;
                padding: 18px 4px 4px;
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 4px 12px;
                font-size: 10.5px;
                line-height: 1.5;
                color: var(--muted);
            }
            .foot span {
                letter-spacing: 0.04em;
            }

            .warn {
                border: 1px solid var(--gold-50);
                background: var(--gold-10);
                color: var(--gold);
                border-radius: 12px;
                padding: 12px 14px;
                font-size: 12.5px;
                line-height: 1.5;
            }
        </style>
    </head>
    <body data-theme="paper">
        <div class="app" id="app"></div>
        <script>
            (() => {
                "use strict";

                const app = document.getElementById("app");
                /* 活动参数放在 hash 里（#activity=...），不带 ? 查询串，
                   这样所有活动共用同一个资源 URL，浏览器/代理缓存才能命中。
                   改 hash 不会重新执行脚本，路由状态由 readRoute() 随时重读。 */
                let params = new URLSearchParams(location.hash.slice(1));
                let activity = (params.get("activity") || "")
                    .trim()
                    .toLowerCase();

                /* ------------------------------------------------------------------ data */

                const SURVEY = [
                    {
                        dim: "pain",
                        key: "p1",
                        en: "In a listening section, I lose focus and miss several answers.",
                        zh: "听力时我一走神，就会连着丢好几题。",
                    },
                    {
                        dim: "pain",
                        key: "p2",
                        en: "In reading or seven-choose-five, I run out of time before I finish.",
                        zh: "阅读或七选五，我常常做不完。",
                    },
                    {
                        dim: "pain",
                        key: "p3",
                        en: "In cloze, grammar or writing, one thing I do not understand turns into a chain of errors.",
                        zh: "完形、语法或写作里，一个地方没弄懂，后面就接着错。",
                    },
                    {
                        dim: "habits",
                        key: "h1",
                        en: "I collect unknown words from papers and review them on a schedule.",
                        zh: "我会把试卷里的生词整理出来，并按计划复盘。",
                    },
                    {
                        dim: "habits",
                        key: "h2",

                function renderSurveyResult() {
                    const dim = { pain: 0, habits: 0, attitude: 0 };
                    SURVEY.forEach((item, i) => {
                        dim[item.dim] += sAnswers[i];
                    });
                    const answerOf = key => {
                        const item = SURVEY.find(x => x.key === key);
                        return sAnswers[SURVEY.indexOf(item)];
                    };
                    const total = dim.pain;
                    const bandKey =
                        total <= 6 ? "low" : total <= 11 ? "moderate" : "high";
                    const band = BANDS[bandKey];
                    const painKeys = ["p1", "p2", "p3"];
                    const habitKeys = ["h1", "h2", "h3"];
                    const painAnswers = painKeys.map(answerOf);
                    const habitAnswers = habitKeys.map(answerOf);
                    const painFocus = Math.max(...painAnswers) >= 3;
                    const habitsOk = Math.min(...habitAnswers) >= 4;
                    const painItems = painFocus
                        ? painKeys
                              .filter(
                                  k => answerOf(k) === Math.max(...painAnswers),
                              )
                              .map(k => FOCUS[k])
                        : [];
                    const habitItems = habitsOk
                        ? []
                        : habitKeys
                              .filter(
                                  k =>
                                      answerOf(k) === Math.min(...habitAnswers),
                              )
                              .map(k => FOCUS[k]);
                    const useHabitsWeakCopy = bandKey === "low" && !habitsOk;
                    const tips = [];

                    if (!habitsOk) tips.push(habitItems[0]);
                    if (dim.attitude <= 5) tips.push(ATTITUDE_TIP);

                    const topEn = painFocus
                        ? (painItems.length > 1
                              ? "Top pains: "
                              : "Top pain: ") +
                          painItems.map(x => x.en).join(", ") +
                          "."
                        : "No clear top pain this week.";
                    const topZh = painFocus
                        ? "最大痛点：" +
                          painItems.map(x => x.zh).join("、") +
                          "。"
                        : "这周没有明显的最大痛点。";
                    const habitEn = habitsOk
                        ? "Habits: already on track."

                          ? "Weak habits: " +
                            habitItems.map(x => x.en).join(", ") +
                            "."
                          : "Weakest habit: " + habitItems[0].en + ".";
                    const habitZh = habitsOk
                        ? "习惯基本到位。"
                        : habitItems.length > 1
                          ? "偏弱习惯：" +
                            habitItems.map(x => x.zh).join("、") +
                            "。"
                          : "最薄弱习惯：" + habitItems[0].zh + "。";

                        chrome("Your profile · 你的画像") +

                                habitItems

                        "</ol>" +
                        '<p class="tiny">This is a self-check for class discussion, not a diagnosis. Nothing is uploaded \u2014 the result stays on your phone.<br>这是课堂自查，不是诊断；数据不上传，只留在你的手机上。</p>' +
                        "</div>" +
                        "</div>" +
                        '<div class="row"><button class="btn ghost" id="retake">Take it again · 再做一次</button><button class="btn primary" id="home">Back · 返回</button></div>' +
                        foot() +
                        "</section>";

                    requestAnimationFrame(() => {
                        document.querySelectorAll(".bar-fill").forEach(bar => {
                            bar.style.width = bar.dataset.w + "%";
                        });
                    });
                    document
                        .getElementById("retake")
                        .addEventListener("click", () => {
                            sIndex = 0;
                            sAnswers = [];
                            renderSurveyIntro();
                        });
                    document
                        .getElementById("home")
                        .addEventListener("click", () => {
                            location.hash = "";
                        });
                }

                /* ------------------------------------------------------------------ race */

                let qParam = 1;
                let question = RACE[1];

                function readRoute() {
                    params = new URLSearchParams(location.hash.slice(1));
                    activity = (params.get("activity") || "")
                        .trim()
                        .toLowerCase();
                    qParam = clamp(
                        parseInt(params.get("q") || "1", 10) || 1,
                        1,
                        3,
                    );
                    question = RACE[qParam];
                }
                let startAt = null;
                let preview = false;
                let raceTimer = null;
                let liveTimer = null;
                let answered = false;
                let clockOffset = 0;
                let clockUncertainty = null;
                let synced = false;
                let syncAttempted = false;
                let clockSamples = [];
                let syncLoop = null;

                const now = () => Date.now() + clockOffset;

                function parseStart(raw) {
                    if (!raw) return null;
                    const value = raw.trim();
                    if (/^\d{10,}$/.test(value)) {
                        const n = Number(value);
                        return n > 1e12 ? n : n * 1000;
                    }
                    if (/^\d{1,2}:\d{2}(:\d{2})?$/.test(value)) {
                        const [h, m, s] = value.split(":").map(Number);
                        const d = new Date();
                        d.setHours(h, m, s || 0, 0);
                        return d.getTime();
                    }
                    const parsed = Date.parse(value);
                    return Number.isNaN(parsed) ? null : parsed;
                }

                /* 时钟校准：并发多次 HEAD，HTTP Date 头只向下截断到整秒，
                   所以每个样本都是"服务器时刻"的下界。取所有样本的下界上确界
                   与上界下确界求交，区间中点即偏移，半宽即不确定度。 */
                function probeOnce() {
                    return new Promise(resolve => {
                        const sent = Date.now();
                        const controller = new AbortController();
                        const timer = setTimeout(
                            () => controller.abort(),
                            2500,
                        );
                        const done = sample => {
                            clearTimeout(timer);
                            resolve(sample);
                        };
                        try {
                            fetch(location.href, {
                                method: "HEAD",
                                cache: "no-store",
                                signal: controller.signal,
                            })
                                .then(res => {
                                    const arrived = Date.now();
                                    const header = res.headers.get("date");
                                    const server = header
                                        ? Date.parse(header)
                                        : NaN;
                                    done(
                                        Number.isNaN(server)
                                            ? null
                                            : { sent, arrived, server },
                                    );
                                })
                                .catch(() => done(null));
                        } catch (err) {
                            done(null);
                        }
                    });
                }

                function applySamples() {
                    if (!clockSamples.length) return;
                    const newest = Math.max(
                        ...clockSamples.map(s => s.arrived),
                    );
                    clockSamples = clockSamples.filter(
                        s => newest - s.arrived <= 6000,
                    );
                    if (clockSamples.length > 12)
                        clockSamples = clockSamples.slice(-12);

                    const mids = clockSamples.map(
                        s => s.server + 500 - s.arrived,
                    );
                    const sorted = mids.slice().sort((a, b) => a - b);
                    const median = sorted[Math.floor(sorted.length / 2)];

                    let lo = -Infinity;
                    let hi = Infinity;
                    clockSamples.forEach((s, i) => {
                        // 离群样本（多半是中间层缓存的旧 Date 头）会污染交集，丢掉
                        if (Math.abs(mids[i] - median) > 1200) return;
                        lo = Math.max(lo, s.server - s.arrived);
                        hi = Math.min(hi, s.server + 1000 - s.sent);
                    });
                    if (
                        !Number.isFinite(lo) ||
                        !Number.isFinite(hi) ||
                        hi <= lo
                    ) {
                        lo = median - 500;
                        hi = median + 500;
                    }

                    clockOffset = Math.round((lo + hi) / 2);
                    clockUncertainty = Math.round((hi - lo) / 2);
                    synced = true;
                    updateSyncBadge();
                }

                async function syncClock(burst) {
                    const results = await Promise.all(
                        Array.from({ length: burst || 2 }, () => probeOnce()),
                    );
                    results.forEach(s => {
                        if (s) clockSamples.push(s);
                    });
                    syncAttempted = true;
                    applySamples();
                    updateSyncBadge(); // 全部失败时也要把徽标从"正在校准"改成回退文案
                }

                function stopSyncLoop() {
                    if (syncLoop) {
                        clearInterval(syncLoop);
                        syncLoop = null;
                    }
                }

                // 等待解锁期间静默补采样：采样跨度越大，整秒截断的不确定性收得越紧
                function refineClock() {
                    stopSyncLoop();
                    let probes = 0;
                    syncLoop = setInterval(() => {
                        if (probes >= 8) return stopSyncLoop();
                        if (
                            clockUncertainty !== null &&
                            clockUncertainty <= 120
                        )
                            return stopSyncLoop();
                        if (startAt !== null && now() >= startAt)
                            return stopSyncLoop();
                        probes++;
                        probeOnce().then(s => {
                            if (s) clockSamples.push(s);
                            applySamples();
                        });
                    }, 350);
                }

                function updateSyncBadge() {
                    const badge = document.getElementById("sync");
                    if (badge) badge.textContent = syncLabel();
                }

                function syncLabel() {
                    if (!synced || clockUncertainty === null)
                        return "Using device clock · 使用设备时钟";
                    return (
                        "Clock synced · 时钟已同步 · \u00b1" +
                        (Math.max(clockUncertainty, 100) / 1000).toFixed(1) +
                        " s"
                    );
                }

                function fmtClock(ms) {
                    const d = new Date(ms);
                    return [d.getHours(), d.getMinutes(), d.getSeconds()]
                        .map(n => String(n).padStart(2, "0"))
                        .join(":");
                }

                function fmtCountdown(ms) {
                    const total = Math.max(0, Math.floor(ms / 1000));
                    const h = Math.floor(total / 3600);
                    const m = Math.floor((total % 3600) / 60);
                    const s = total % 60;
                    const mmss =
                        String(m).padStart(2, "0") +
                        ":" +
                        String(s).padStart(2, "0");
                    return h > 0
                        ? String(h).padStart(2, "0") + ":" + mmss
                        : mmss;
                }

                function writeAnswerParam(letter, ms) {
                    const query = new URLSearchParams(location.hash.slice(1));
                    if (letter) query.set("answer", letter);
                    else query.delete("answer");
                    if (Number.isFinite(ms))
                        query.set("t", String(Math.max(0, Math.round(ms))));
                    else query.delete("t");
                    query.set(
                        "sign",
                        raceSign(
                            String(qParam),
                            query.get("start") || "",
                            query.get("preview") === "1" ? "1" : "0",
                            query.get("answer") || "",
                            query.get("t") || "",
                        ),
                    );
                    const qs = query.toString();
                    history.replaceState(
                        null,
                        "",
                        location.pathname +
                            location.search +
                            (qs ? "#" + qs : ""),
                    );
                }

                /* 抢答链接签名：与展示页 raceSign 必须逐字一致。
                   无后端，密钥在源码里，只防手改地址栏。 */
                function raceSign(q, start, preview, answer, t) {
                    const text =
                        "race|" +
                        q +
                        "|" +
                        start +
                        "|" +
                        preview +
                        "|" +
                        answer +
                        "|" +
                        t +
                        "|wxf-race";
                    let h = 0x811c9dc5;
                    for (let i = 0; i < text.length; i++) {
                        h ^= text.charCodeAt(i);
                        h = Math.imul(h, 16777619) >>> 0;
                    }
                    return ("0000000" + h.toString(16)).slice(-8);
                }

                function signValid() {
                    const raw = params.get("sign");
                    if (!raw) return false;
                    return (
                        raw.trim().toLowerCase() ===
                        raceSign(
                            String(qParam),
                            params.get("start") || "",
                            params.get("preview") === "1" ? "1" : "0",
                            (params.get("answer") || "").trim().toUpperCase(),
                            (params.get("t") || "").trim(),
                        )
                    );
                }

                function savedAnswerIndex() {
                    const raw = (params.get("answer") || "")
                        .trim()
                        .toUpperCase();
                    if (!raw) return null;
                    const byLetter = letters.indexOf(raw);
                    if (byLetter >= 0 && byLetter < question.options.length)
                        return byLetter;
                    const n = parseInt(raw, 10);
                    return Number.isInteger(n) &&
                        n >= 0 &&
                        n < question.options.length
                        ? n
                        : null;
                }

                function savedAnswerMs() {
                    const raw = (params.get("t") || "").trim();
                    const n = Number(raw);
                    return raw && Number.isFinite(n) && n >= 0 ? n : null;
                }

                function raceShell(inner, tag) {
                    return (
                        '<section class="screen">' +
                        chrome(tag || "Live race · 现场抢答") +
                        inner +
                        foot() +
                        "</section>"
                    );
                }

                function renderRaceWaiting() {
                    document.body.dataset.theme = "ink";
                    app.innerHTML = raceShell(
                        '<div class="race-top"><span class="dot"></span>Round ' +
                            qParam +
                            " \u00b7 waiting · 第 " +
                            qParam +
                            " 题 · 等待开始</div>" +
                            '<div class="wait">' +
                            '<div class="big-emoji sm" aria-hidden="true">\u23F3</div>' +
                            "<h1>You\u2019re in.<br>Keep this page open.</h1>" +
                            '<p class="zh" style="font-size:15px;margin-top:-6px">已进入，<br>请勿关闭此页面。</p>' +
                            '<div class="count" id="count">--:--</div>' +
                            '<div class="wait-sub">The question unlocks on its own at <b>' +
                            fmtClock(startAt) +
                            '</b>. Don\u2019t refresh.<span class="zh" style="display:block;margin-top:4px"><b>' +
                            fmtClock(startAt) +
                            "</b> 时自动出题，请不要刷新。</span></div>" +
                            '<div class="sync" id="sync">Syncing clock\u2026 · 正在校准时钟…</div>' +
                            '<div class="tipbox" style="margin-top:4px"><div class="tip"><b>Scoring · 计分</b>Fastest correct answer wins. Your time stays on screen for the judge.<span class="zh" style="display:block;margin-top:4px">最快答对者获胜。用时留在屏幕上，给裁判看。</span></div></div>' +
                            "</div>",
                        "Round " + qParam + " · 第 " + qParam + " 题",
                    );

                    const tick = () => {
                        const el = document.getElementById("count");
                        if (!el) return;
                        // 校准回来前既不显示倒计时也不判定"已开始"：设备时钟偏快会提前放题、
                        // 偏慢会让倒计时先亮后跳
                        if (!syncAttempted) return;
                        const left = startAt - now();
                        if (left <= 0) {
                            clearInterval(raceTimer);
                            stopSyncLoop();
                            renderRaceQuestion();
                        } else {
                            el.textContent = fmtCountdown(left);
                        }
                    };
                    tick();
                    raceTimer = setInterval(tick, 100);
                    refineClock();
                }

                function renderRaceQuestion(badgeText) {
                    clearInterval(raceTimer);
                    clearInterval(liveTimer);
                    stopSyncLoop();
                    answered = false;
                    document.body.dataset.theme = "ink";
                    const baseTime = startAt !== null ? startAt : now();
                    app.innerHTML = raceShell(
                        '<div class="qhead"><div class="race-top"><span class="dot"></span>Round ' +
                            qParam +
                            " \u00b7 go · 第 " +
                            qParam +
                            ' 题 · 开始</div><div class="live-time" id="live">0.00 s</div></div>' +
                            '<div class="qwrap">' +
                            (badgeText
                                ? '<div class="sync">' +
                                  esc(badgeText) +
                                  "</div>"
                                : "") +
                            "<h2>" +
                            esc(question.en) +
                            "</h2>" +
                            '<div class="race-opts" id="raceOpts">' +
                            question.options
                                .map(
                                    (opt, i) =>
                                        '<button class="race-opt" data-i="' +
                                        i +
                                        '"><span class="k">' +
                                        letters[i] +
                                        "</span><span>" +
                                        esc(opt) +
                                        "</span></button>",
                                )
                                .join("") +
                            "</div>" +
                            '<p class="rank-note" style="margin-top:auto">One tap only. Your time counts from the official start, not from when you opened this page.<br>只能点一次。用时从正式开始时间算，不是从你打开页面时算。</p>' +
                            "</div>",
                        "Round " + qParam + " · 第 " + qParam + " 题",
                    );

                    const live = document.getElementById("live");
                    liveTimer = setInterval(() => {
                        if (live)
                            live.textContent =
                                (Math.max(0, now() - baseTime) / 1000).toFixed(
                                    1,
                                ) + " s";
                    }, 60);

                    const opts = document.getElementById("raceOpts");
                    opts.addEventListener("click", event => {
                        const btn = event.target.closest(".race-opt");
                        if (!btn || answered) return;
                        answered = true;
                        clearInterval(liveTimer);
                        const chosen = Number(btn.dataset.i);
                        const ms = Math.max(0, now() - baseTime);
                        writeAnswerParam(letters[chosen], ms);
                        opts.querySelectorAll(".race-opt").forEach(b => {
                            b.classList.add(b === btn ? "chosen" : "dim");
                        });
                        setTimeout(() => renderRaceResult(chosen, ms), 220);
                    });
                }

                function renderRaceResult(chosen, ms) {
                    clearInterval(liveTimer);
                    stopSyncLoop();
                    const correct = chosen === question.correct;
                    const seconds = (ms / 1000).toFixed(1);
                    app.innerHTML = raceShell(
                        '<div class="race-top"><span class="dot"></span>Round ' +
                            qParam +
                            " \u00b7 answered · 第 " +
                            qParam +
                            " 题 · 已作答</div>" +
                            '<div class="qwrap" style="justify-content:center">' +
                            '<div class="judge">Show this screen to the judge · 把这屏给裁判看</div>' +
                            '<div class="big-emoji" aria-hidden="true">' +
                            (correct ? "\u2705" : "\uD83E\uDD14") +
                            "</div>" +
                            '<div class="big-time">' +
                            seconds +
                            "<span>s</span></div>" +
                            '<div class="verdict ' +
                            (correct ? "ok" : "no") +
                            '">' +
                            (correct ? "Correct · 正确" : "Not quite · 不对") +
                            "</div>" +
                            '<p class="answer-line">Your answer: <b>' +
                            letters[chosen] +
                            "</b> \u00b7 Correct answer: <b>" +
                            letters[question.correct] +
                            "</b> \u2014 " +
                            esc(question.options[question.correct]) +
                            '<span class="zh" style="display:block;margin-top:4px">你的答案：<b>' +
                            letters[chosen] +
                            "</b> · 正确答案：<b>" +
                            letters[question.correct] +
                            "</b> — " +
                            esc(question.optionsZh[question.correct]) +
                            "</span></p>" +
                            '<p class="explain">' +
                            esc(question.explain) +
                            '<span class="zh" style="display:block;margin-top:6px">' +
                            esc(question.explainZh) +
                            "</span></p>" +
                            '<div class="tipbox"><div class="tip"><b>For the judge · 裁判看这里</b>Time counts from the official start. Fastest correct answer wins; wrong answers don\u2019t rank.<span class="zh" style="display:block;margin-top:4px">用时从正式开始时间算起。最快答对者获胜，答错不进排名。</span></div></div>' +
                            (preview
                                ? '<button class="btn ghost block" id="again">Test again · 再测一次</button>'
                                : '<p class="rank-note">Leave this screen open and don\u2019t refresh.<br>这屏别关，也别刷新。</p>') +
                            "</div>",
                        "Round " + qParam + " · 第 " + qParam + " 题",
                    );
                    if (preview) {
                        document
                            .getElementById("again")
                            .addEventListener("click", () => {
                                writeAnswerParam(null);
                                startAt = now();
                                renderRaceQuestion(
                                    "Test mode \u00b7 this link has no start time · 测试模式 · 这条链接没设开始时间",
                                );
                            });
                    }
                }

                function renderScanRequired(reason) {
                    document.body.dataset.theme = "paper";
                    app.innerHTML =
                        '<section class="screen">' +
                        chrome("Live race · 现场抢答") +
                        '<div class="wait">' +
                        "<h1>Scan the QR code<br>on the slide.</h1>" +
                        '<p class="zh" style="font-size:15px;margin-top:-6px">扫幻灯片上的二维码，进抢答。</p>' +
                        '<p class="wait-sub">This link carries the round and the official start time, so it only works from the QR code shown in class.<span class="zh" style="display:block;margin-top:4px">这条链接带题号和正式开始时间，只能从课堂上的二维码进。</span></p>' +
                        (reason
                            ? '<div class="warn">' + esc(reason) + "</div>"
                            : "") +
                        "</div>" +
                        foot() +
                        "</section>";
                }

                /* 验签失败时的硬拦截页：不给题目、不给结果，只留一句冷幽默 + 重扫提示 */
                const TAMPER_LINES = [
                    [
                        "Nice try \u2014 the URL remembers what I wrote.",
                        "想得美，链接记得我当初写的是啥。",
                    ],
                    ["Link edited. Bold move.", "链接改了，胆子不小。"],
                    [
                        "You hacked a URL, not the exam.",
                        "你黑的是网址，不是考试。",
                    ],
                    [
                        "This link is not the one I handed out.",
                        "这条链接不是我发的那条。",
                    ],
                    [
                        "Fastest fingers, or fastest at editing the link?",
                        "比手快，还是比改链接快？",
                    ],
                ];

                function renderTamperCaught() {
                    const pick =
                        TAMPER_LINES[(Math.random() * TAMPER_LINES.length) | 0];
                    document.body.dataset.theme = "paper";
                    app.innerHTML =
                        '<section class="screen">' +
                        chrome("Live race · 现场抢答") +
                        '<div class="wait">' +
                        "<h1>" +
                        esc(pick[0]) +
                        "</h1>" +
                        '<p class="zh" style="font-size:15px;margin-top:-6px">' +
                        esc(pick[1]) +
                        "</p>" +
                        '<p class="wait-sub">This link has been edited, so the race won\u2019t open here. Scan the QR code on the slide again.<span class="zh" style="display:block;margin-top:4px">这条链接被改过了，抢答不会在这里打开。重新扫一下幻灯片上的二维码。</span></p>' +
                        "</div>" +
                        foot() +
                        "</section>";
                }

                async function startRace() {
                    document.body.dataset.theme = "ink";
                    const rawStart = params.get("start");
                    const parsed = parseStart(rawStart);
                    const testMode = params.get("preview") === "1";
                    // 签名缺失或与实算不符：一律不出题、不出结果（preview 也不例外）
                    if (!signValid()) {
                        renderTamperCaught();
                        return;
                    }
                    if (!testMode && parsed === null) {
                        renderScanRequired(
                            "This link has no start time \u00b7 此链接没有开始时间",
                        );
                        return;
                    }
                    preview = testMode || parsed === null;
                    startAt = preview ? now() : parsed;

                    const already = savedAnswerIndex();
                    if (already !== null) {
                        answered = true;
                        await syncClock(2);
                        const stored = savedAnswerMs();
                        renderRaceResult(
                            already,
                            stored !== null
                                ? stored
                                : startAt !== null
                                  ? Math.max(0, now() - startAt)
                                  : 0,
                        );
                        return;
                    }

                    syncClock(2);

                    if (preview) {
                        renderRaceQuestion(
                            rawStart
                                ? "Test mode \u00b7 start time not recognised · 测试模式 · 开始时间格式不对"
                                : "Test mode \u00b7 this link has no start time · 测试模式 · 这条链接没设开始时间",
                        );
                    } else {
                        // 先出等待页：设备时钟可能偏快，"是否已开始"交给 tick 在校准后判断
                        renderRaceWaiting();
                    }
                }

                /* ------------------------------------------------------------------ boot */

                function boot() {
                    readRoute();
                    if (activity === "survey") renderSurveyIntro();
                    else if (activity === "race") startRace();
                    else if (activity === "") renderLanding();
                    else
                        renderLanding(
                            "Unknown activity id \u201c" +
                                activity +
                                "\u201d. Use #activity=survey or #activity=race.\n未知的活动编号“" +
                                activity +
                                "”。请使用 #activity=survey 或 #activity=race。",
                        );
                }

                /* 落地页的入口是 # 链接：只改 hash 不会重新加载，
                   必须监听 hashchange 重新路由，否则点问卷没反应。 */
                window.addEventListener("hashchange", () => {
                    stopSyncLoop();
                    clearInterval(raceTimer);
                    clearInterval(liveTimer);
                    raceTimer = null;
                    liveTimer = null;
                    boot();
                });

                boot();
            })();
        </script>
    </body>
</html>
